<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#191b18"/>
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#c8963e" stroke-width="1.5" opacity="0.6"/>
  <text x="56" y="72" fill="#c8963e" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">PELAT ARSIP 04 · AKULTURASI &amp; TATA RUANG PECINAN KESULTANAN BANTEN (ABAD XVI–XIX)</text>
  <text x="56" y="106" fill="#f4f4f2" font-family="Spectral, Georgia, serif" font-size="24" font-weight="600">Syahbandar Kiyai Ngabehi Cakradana &amp; Masjid Pacinan Tinggi</text>
  <!-- Architectural Pagoda-Minaret & Spatial Map of Banten Pecinan -->
  <g transform="translate(56, 138)">
    <rect x="0" y="0" width="320" height="280" fill="#222520" stroke="#c8963e" stroke-width="1.5"/>
    <!-- Pagoda-style Minaret of Masjid Pacinan Tinggi -->
    <g transform="translate(160, 35)" stroke="#e5b869" stroke-width="1.8" fill="#2e332b">
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#e5b869" stroke-width="2"/>
      <polygon points="-28,22 0,0 28,22"/>
      <rect x="-20" y="22" width="40" height="32"/>
      <polygon points="-36,68 0,48 36,68"/>
      <rect x="-26" y="68" width="52" height="42"/>
      <polygon points="-46,126 0,104 46,126"/>
      <rect x="-34" y="126" width="68" height="58"/>
      <rect x="-44" y="184" width="88" height="16"/>
    </g>
    <text x="160" y="256" text-anchor="middle" fill="#ebd9b8" font-family="JetBrains Mono, monospace" font-size="11.5">MENARA MASJID PACINAN TINGGI BANTEN</text>
  </g>
  <g transform="translate(400, 138)">
    <rect x="0" y="0" width="344" height="280" fill="#22201b" stroke="#c8963e" stroke-width="1.5"/>
    <text x="20" y="34" fill="#e5b869" font-family="Spectral, Georgia, serif" font-size="18" font-weight="600">Dinamika Ruang Pecinan Banten</text>
    <text x="20" y="64" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">• 1596: Permukiman di sudut barat laut kota</text>
    <text x="20" y="86" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">  dekat muara sungai &amp; Laut Jawa (Nayati, 1985)</text>
    <text x="20" y="114" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">• 1726: Bergeser ke bagian tengah sisi barat</text>
    <text x="20" y="136" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">  Kota Banten di luar tembok benteng</text>
    <text x="20" y="164" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">• Bangunan bata berplester kapur &amp; jalan</text>
    <text x="20" y="186" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="14">  berpasir pencegah kebakaran gudang lada</text>
    <text x="20" y="216" fill="#c8963e" font-family="JetBrains Mono, monospace" font-size="12">TOKOH KUNCI: TANTSEKO / CAKRADANA</text>
    <text x="20" y="238" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="13">Syahbandar utama &amp; arsitek Istana Surosowan</text>
  </g>
  <line x1="56" y1="450" x2="744" y2="450" stroke="#c8963e" stroke-width="0.8" opacity="0.5"/>
  <text x="56" y="482" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="15">Kawasan Banten Lama merekam interaksi multietnis melalui toponimi Pecinan, Pekojan, Kampung Bugis,</text>
  <text x="56" y="505" fill="#ebd9b8" font-family="Source Sans 3, sans-serif" font-size="15">Dermayon, dan Kebalen, sementara komunitas Cina Benteng tumbuh di Tangerang (Thresnawaty, 2015).</text>
  <text x="56" y="542" fill="#c8963e" font-family="JetBrains Mono, monospace" font-size="12">SUMBER: NAYATI (1985) · FAUZIAH (2009) · FAUZIAH &amp; ROHMAN (2019) · WIBOWO ET AL. (2025)</text>
</svg>
